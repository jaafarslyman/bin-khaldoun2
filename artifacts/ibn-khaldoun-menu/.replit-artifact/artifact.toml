kind = "web"
previewPath = "/"
title = "بن خلدون — القائمة"
description = "An Arabic-first café menu and table-ordering app, with a staff-managed menu and Supabase-backed order submission."
version = "1.0.0"
id = "artifacts/ibn-khaldoun-menu"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18823

[services.development]
run = "pnpm --filter @workspace/ibn-khaldoun-menu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ibn-khaldoun-menu", "run", "build" ]
serve = "static"
publicDir = "artifacts/ibn-khaldoun-menu/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18823"
BASE_PATH = "/"
